<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0908">
<title>CookFire · Tanıtım videosu</title>
<link rel="icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/promo.css">
</head>
<body>
<!-- Tanıtım videosu (Reels / Story 9:16): şarkılar cihazdan seçilir, sunucuya gönderilmez. Yalnız web; mobil pakete girmez (scripts/build-www.mjs). -->
<main class="pm">
  <section class="pm-stage" id="stage" aria-label="Video önizlemesi">
    <canvas id="cv" width="1080" height="1920"></canvas>
    <button class="pm-empty" id="emptyAdd" type="button">
      <span class="pm-plus" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
      <b>Şarkı ekle</b><small>Müzik + kapak görseli ya da videosu</small>
    </button>
    <div class="pm-rec" id="rec" hidden><i></i><span id="recT">Kaydediliyor</span></div>
  </section>

  <aside class="pm-side">
    <header class="pm-head"><div><b>CookFire</b><span>Tanıtım videosu · 9:16</span></div><button class="pm-x" id="pmClose" type="button" aria-label="Kapat" hidden><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <ol class="pm-list" id="list" aria-label="Şarkı sırası"></ol>
    <button class="pm-add" id="addBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Şarkı ekle</button>
    <div class="pm-fields">
      <label>Kanca yazısı <small>(kelimeler ritimle tek tek belirir)</small><input id="hook" maxlength="80" value="Var olan müziklerden ilham alarak kendi müziğini yarat."></label>
      <label>Çağrı yazısı <small>(son şarkıda)</small><input id="cta" maxlength="40" value="Profili ziyaret et"></label>
      <div class="pm-two"><label>Marka <small>(sonda ritimle atar)</small><input id="brand" maxlength="30" value="CookFire"></label>
      <label>Marka altı<input id="sub" maxlength="40" value="Uygulamayı ücretsiz indir"></label></div>
    </div>
    <div class="pm-actions">
      <button class="pm-btn" id="playBtn" type="button" disabled>Önizle</button>
      <button class="pm-btn pm-primary" id="exportBtn" type="button" disabled>Video indir</button>
    </div>
    <p class="pm-note" id="note">1080×1920 · Reels ve Story boyutu. Kayıt gerçek zamanlıdır; bitene kadar bu ekranı açık tut.</p>
  </aside>
</main>

<dialog class="pm-modal" id="modal" aria-labelledby="mT">
  <form method="dialog" class="pm-m" id="mForm">
    <div class="pm-m-h"><b id="mT">Şarkı ekle</b><button class="pm-x" type="button" id="mClose" aria-label="Kapat"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="pm-files">
      <label class="pm-file" id="mAudioL"><input type="file" id="mAudio" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.flac">
        <span class="pm-fi"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></span>
        <span class="pm-ft"><b>Müzik dosyası</b><small id="mAudioN">MP3, WAV, M4A</small></span></label>
      <label class="pm-file" id="mCoverL"><input type="file" id="mCover" accept="image/*,video/*">
        <span class="pm-fi pm-thumb" id="mThumb"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg></span>
        <span class="pm-ft"><b>Kapak</b><small id="mCoverN">Görsel ya da video</small></span></label>
    </div>
    <div class="pm-row">
      <label>Şarkı adı<input id="mTitle" maxlength="60" required></label>
      <label>Sanatçı<input id="mArtist" maxlength="60"></label>
    </div>
    <div class="pm-pick" id="mPick" hidden>
      <div class="pm-pick-h"><b>Videoda çalacak bölüm</b><span id="mTime"></span></div>
      <canvas id="mWave" height="104"></canvas>
      <div class="pm-pick-f">
        <button class="pm-pp" type="button" id="mPlay" aria-label="Bölümü dinle"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <div class="pm-chips" id="mLens" role="group" aria-label="Bölüm uzunluğu">
          <button type="button" data-len="15">15 sn</button><button type="button" data-len="20">20 sn</button><button type="button" data-len="30">30 sn</button><button type="button" data-len="45">45 sn</button><button type="button" data-len="60">60 sn</button>
        </div>
      </div>
      <small class="pm-hint">Kutuyu sürükleyerek bölümü seç, kenarlarından uzat. Açılışta en güçlü bölüm (nakarat) seçili gelir.</small>
    </div>
    <div class="pm-m-f">
      <button class="pm-btn pm-del" type="button" id="mDel" hidden>Kaldır</button>
      <span class="pm-sp"></span>
      <button class="pm-btn" type="button" id="mCancel">Vazgeç</button>
      <button class="pm-btn pm-primary" type="submit" id="mSave" disabled>Kaydet</button>
    </div>
  </form>
</dialog>
<script src="/i18n-langs.js"></script>
<script src="/i18n.js"></script>
<script src="/promo.js"></script>
</body>
</html>
