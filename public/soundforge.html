<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SoundForge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Grenze+Gotisch:wght@500..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/auth.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <button class="nav-create" data-create="simple"></button>
    <button class="nav on" data-go="home"></button>
    <button class="nav" data-go="studio"></button>
    <button class="nav" data-go="library"></button>
    <button class="nav" data-go="profile"></button>
  </aside>

  <main class="main" id="main">
    <!-- HOME -->
    <section class="view" id="v-home">
      <div class="explore" id="explore">
        <div class="ex-stage" id="exStage"><div id="exGrid"></div></div>
        <div class="ex-vig"></div>
        <div class="ex-focus"><div class="ex-pill"><b id="exName">#trap</b><button class="ex-go" id="exGo" aria-label="Bu türle oluştur"></button></div></div>
      </div>
    </section>

    <!-- STUDIO -->
    <section class="view" id="v-studio" hidden>
      <div class="vt"><h1>Stüdyo</h1></div>
      <div class="tools" id="tools"></div>
      <div id="peopleWrap"></div>
    </section>

    <!-- LIBRARY -->
    <section class="view" id="v-library" hidden>
      <div class="vt"><h1>Kütüphane</h1><button class="circle" id="searchBtn" aria-label="Ara"></button></div>
      <div class="search-row" id="searchRow" hidden><input class="inp" id="q" placeholder="Başlık ya da stil"></div>
      <div class="scroll-x cats" id="cats"></div>
      <div class="sec"><h2>Şarkılarım</h2><button class="filter-btn" id="filterBtn">Filtre <span id="filtIc"></span></button></div>
      <div class="list" id="libList"></div>
    </section>

    <!-- PROFILE -->
    <section class="view" id="v-profile" hidden>
      <div class="p-head"><span class="p-av" id="pAv"></span><div><b>Profilim</b><small id="pCount">0 parça</small><small id="pMode" style="display:block"></small></div></div>
      <div class="credit-card"><div class="n"><span class="cr">0</span><small>kredi</small></div><div class="meter"><i id="meter"></i></div></div>
      <div class="form">
        <div><div class="lbl">Tema</div><div class="seg" id="themeSeg"><button data-v="auto" class="on">Sistem</button><button data-v="light">Açık</button><button data-v="dark">Koyu</button></div></div>
        <div><div class="lbl">Varsayılan model</div><select class="inp" id="defModel"><option value="V6">V6</option><option value="V6_MINI">V6 Mini</option><option value="V6_WILD">V6 Wild</option></select></div>      </div>
    </section>
  </main>


</div>

<div class="dock" id="dock">
  <div class="mini" id="mini" hidden>
    <div class="mini-prog"><i id="miniProg"></i></div>
    <button class="mini-main" id="miniOpen"><span class="mini-art" id="miniArt"></span><span class="mini-txt"><b id="miniTitle"></b><small id="miniSub"></small></span></button>
    <button class="play-md" id="miniPlay" aria-label="Oynat"></button>
  </div>
  <nav class="tabs" id="tabs" aria-label="Ana menü"><span class="tab-ind" id="tabInd"></span>
    <button class="tab on" data-go="home"></button>
    <button class="tab" data-go="studio"></button>
    <button class="tab-create" data-create="simple" aria-label="Oluştur"><span></span></button>
    <button class="tab" data-go="library"></button>
    <button class="tab" data-go="profile"><span class="av" id="tabAv"></span></button>
  </nav>
</div>

<!-- CREATE MODAL -->
<div class="modal" id="mCreate" role="dialog" aria-modal="true" aria-label="Oluştur">
  <div class="m-top">
    <div class="m-side"><button class="icon-btn" data-close aria-label="Kapat"></button></div>
    <div class="m-tabs" id="modeTabs"><button data-v="simple" class="on">Basit</button><button data-v="custom">Özel</button><button data-v="audio">Sesten</button></div>
    <div class="m-side"><span class="cr-chip" aria-label="Kredi"><span id="crIc"></span><b class="cr">0</b></span></div>
  </div>
  <div class="m-body">
    <h1 class="c-title" data-pane="simple">Ne <span>yaratalım?</span></h1>
    <div class="outs" id="outSeg"><button class="out on" data-v="song">Vokal</button><button class="out" data-v="beat">Beat</button></div>

    <div data-pane="simple" class="c-simple">
      <div class="composer"><span class="ring"></span>
        <div class="comp-in">
          <textarea id="desc" rows="3" maxlength="500" placeholder="Yağmurlu bir gece, melankolik trap…"></textarea>
          <div class="comp-bar">
            <button class="cbtn" id="cPlus" aria-label="Ses ekle"></button>
            <button class="mode-dd" id="cMode">Özel <span id="ddIc"></span></button>
            <button class="cbtn" id="cMic" aria-label="Telefonla kaydet"></button>
            <button class="send" id="cSend" aria-label="Oluştur"></button>
          </div>
        </div>
      </div>
      <div class="err" id="simpleErr"></div>
      <div class="scroll-x sugs" id="sugs"></div>
    </div>

    <div data-pane="custom" hidden style="display:flex;flex-direction:column;gap:12px">
      <div class="ta-wrap" id="lyrWrap">
        <textarea class="ta" id="lyrics" rows="9" maxlength="5000" placeholder="Sözler"></textarea>
        <button class="ta-btn" id="lyrIdea"></button>
      </div>
      <input class="inp" id="style" maxlength="1000" placeholder="Stil">
      <div class="scroll-x chips" id="styleChips"></div>
      <div class="row2"><input class="inp" id="title" maxlength="80" placeholder="Başlık"><div class="seg" id="genderSeg"><button data-v="f" class="on">Kadın</button><button data-v="m">Erkek</button></div></div>
      <select class="inp" id="persona" hidden aria-label="Ses karakteri"></select>
      <button class="adv-btn" id="advBtn">Gelişmiş <span id="advChev"></span></button>
      <div class="adv" id="adv" hidden>
        <label class="sl">Stil bağlılığı<output id="swO"></output><input type="range" id="sw" min="0" max="100" value="70"></label>
        <label class="sl">Deneysellik<output id="wcO"></output><input type="range" id="wc" min="0" max="100" value="30"></label>
        <label class="sl" id="awWrap">Ses ağırlığı<output id="awO"></output><input type="range" id="aw" min="0" max="100" value="60"></label>
        <label class="sl">Süre<output id="durO">2:00</output><input type="range" id="dur" min="10" max="360" step="5" value="120"></label>
        <div class="seg" id="varSeg"><button data-v="0">Sabit</button><button data-v="1" class="on">Normal</button><button data-v="2">Yüksek</button><button data-v="4">Maks</button></div>
        <input class="inp" id="neg" placeholder="Kaçınılacaklar">
        <select class="inp" id="model"><option value="V6">V6</option><option value="V6_MINI">V6 Mini</option><option value="V6_WILD">V6 Wild</option></select>
      </div>
    </div>

    <div data-pane="audio" hidden style="display:flex;flex-direction:column;gap:12px">
      <div id="recCard"></div>
      <div class="scroll-x chips" id="opChips">
        <button class="chip on" data-v="cover">Cover</button><button class="chip" data-v="extend">Uzat</button><button class="chip" data-v="vocals">Vokal ekle</button>
      </div>
      <textarea class="ta" id="aLyrics" rows="5" maxlength="5000" placeholder="Sözler" hidden></textarea>
      <div class="row2"><input class="inp" id="aTitle" maxlength="80" placeholder="Başlık"><input class="inp" id="aStyle" maxlength="1000" placeholder="Stil"></div>
    </div>
  </div>
  <div class="m-foot" id="mFoot"><div class="err" id="createErr"></div><button class="primary" id="createBtn"><span>Oluştur</span><span class="cost" id="createCost"></span></button></div>
</div>

<!-- TOOL MODAL -->
<div class="modal compact" id="mTool" role="dialog" aria-modal="true">
  <div class="m-top"><button class="icon-btn" data-close aria-label="Kapat"></button><h3 id="toolTitle"></h3></div>
  <div class="m-body" id="toolBody"></div>
  <div class="m-foot"><div class="err" id="toolErr"></div><button class="primary" id="toolGo"></button></div>
</div>

<!-- FULL PLAYER -->
<div class="fp" id="fp" aria-hidden="true">
  <div class="fp-tint" id="fpTint"></div>
  <div class="fp-inner">
    <div class="fp-grab" id="fpGrab" role="button" aria-label="Kapat"><div></div></div>
    <div class="arts"><button class="peek" id="peekPrev" aria-label="Önceki"></button><div class="frame"><div id="fpArt"></div></div><button class="peek" id="peekNext" aria-label="Sonraki"></button></div>
    <div class="fp-meta"><div><h2 id="fpTitle"></h2><p id="fpSub"></p></div><button class="icon-btn" id="fpMore" aria-label="Diğer"></button></div>
    <div class="scroll-x pills" id="fpPills"></div>
    <div class="bar" id="fpBar"><i id="fpFill"></i></div>
    <div class="times"><span id="fpCur">00:00</span><span id="fpDur">--:--</span></div>
    <div class="ctrl">
      <button class="icon-btn sm" id="fpShuf" aria-label="Karıştır"></button>
      <button class="icon-btn" id="fpPrev" aria-label="Önceki"></button>
      <button class="play-xl" id="fpPlay" aria-label="Oynat"></button>
      <button class="icon-btn" id="fpNext" aria-label="Sonraki"></button>
      <button class="icon-btn sm" id="fpRep" aria-label="Tekrarla"></button>
    </div>
    <div class="card"><div class="card-h"><h3>Bu şarkı hakkında</h3></div><p id="fpAbout"></p><div id="fpParent"></div></div>
    <div class="card"><div class="card-h"><h3>Stil</h3><div><button class="circle" id="styleRemix" aria-label="Bu stille üret"></button><button class="circle" id="styleCopy" aria-label="Kopyala"></button></div></div><p class="val" id="fpStyle"></p></div>
    <div class="card" id="lyrCard"><div class="card-h"><h3>Sözler</h3><div style="display:flex"><span class="lyr-st" id="lyrSt"></span><button class="circle" id="lyrCopy" aria-label="Kopyala"></button></div></div><div class="lyr" id="fpLyr"></div></div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script src="/recorder.js"></script>
<script src="/app.js"></script>
<script src="/auth.js"></script>
<script type="module" src="/fb.js"></script>
</body>
</html>
